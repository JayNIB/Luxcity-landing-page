<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Luxcity Hotel & Apartment - Room Previews</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #c5a880;
            --dark-bg: #121212;
            --card-bg: #1e1e1e; /* Exact rich dark grey container background */
            --text-light: #ffffff;
            --text-muted: #cccccc;
            --telegram-color: #0088cc;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px 12px; /* Base mobile outer padding */
            overflow-x: hidden; /* Strict global horizontal leak protection */
        }

        @media (min-width: 768px) {
            body {
                padding: 40px 24px;
            }
        }

        /* Main Card Container */
        .landing-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden; /* Clip everything cleanly to the border radius */
            box-shadow: 
                0 0 0 1px var(--border-color), 
                0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        /* Clean, Sophisticated Brand Header Area */
        .brand-header-clean {
            width: 100%;
            padding: 40px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: transparent;
            box-sizing: border-box;
        }

        /* Framed Property Banner Card */
        .hero-banner-container {
            padding: 0 20px; /* Aligns visually with main content padding */
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 25px;
        }

        .hero-banner-image {
            width: 100%;
            height: 240px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
            background: 
                linear-gradient(to bottom, rgba(0, 0, 0, 0) 50%, rgba(18, 18, 18, 0.7) 100%),
                url('luxcityfront.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
        }

        @media (min-width: 768px) {
            .hero-banner-image {
                height: 340px; 
            }
        }

        .luxcity-logo-img {
            width: auto;
            height: 75px;
            margin-bottom: 15px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }

        /* UNIFORM PREMIUM BRAND FONT AND GOLD COLOR STYLING */
        .brand-title-main {
            font-family: 'Inter', sans-serif;
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--primary-gold);
            text-shadow: 0 3px 14px rgba(0, 0, 0, 0.95);
            margin-top: 5px;
            word-wrap: break-word; /* Prevents long text from pushing past screen bounds */
        }

        @media (max-width: 480px) {
            .brand-title-main {
                font-size: 1.5rem;
            }
        }

        /* HARD PROTECTION: Inner Content Padding Container */
        .main-content-body {
            padding: 0 20px 30px 20px;
            width: 100%;
            box-sizing: border-box;
            overflow: hidden; /* Keeps all children perfectly isolated */
        }

        @media (max-width: 400px) {
            .main-content-body {
                padding: 0 16px 25px 16px; /* Slightly tighter on ultra-small mobile profiles */
            }
        }

        /* Hotel Info Section */
        .hotel-info-section {
            background: rgba(0, 0, 0, 0.25);
            border-left: 3px solid var(--primary-gold);
            padding: 18px 20px;
            border-radius: 4px 8px 8px 4px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-muted);
            box-sizing: border-box;
        }

        .hotel-info-section strong {
            color: var(--text-light);
        }

        /* Selector Styling */
        .selection-box {
            margin-bottom: 20px;
            width: 100%;
        }

        .selection-box label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary-gold);
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* Punchline Style */
        .punchline {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        .punchline span {
            color: var(--primary-gold);
        }

        .room-dropdown {
            width: 100%;
            padding: 16px;
            background-color: #2a2a2a;
            color: var(--text-light);
            border: 2px solid transparent;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23c5a880' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 18px;
            box-sizing: border-box;
        }

        .room-dropdown:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 10px rgba(197, 168, 128, 0.2);
        }

        /* CINEMATIC BORDERLESS VIDEO PLAYER */
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Fixed 16:9 Aspect Ratio Box */
            background-color: #000000; 
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            display: block;
            box-shadow: 
                inset 0 0 25px rgba(0, 0, 0, 0.9),
                0 4px 20px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .video-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 35px rgba(30, 30, 30, 0.98);
        }

        /* Action Buttons Styling */
        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 30px;
            width: 100%;
        }

        @media (min-width: 576px) {
            .cta-container {
                flex-direction: row;
            }
        }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 8px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, filter 0.2s ease;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            box-sizing: border-box;
            white-space: nowrap;
        }

        @media (max-width: 360px) {
            .btn {
                font-size: 0.9rem;
                padding: 16px 10px;
            }
        }

        .btn:hover {
            transform: scale(1.02) translateY(-2px);
            filter: brightness(1.15);
        }

        .btn:active {
            transform: scale(0.98) translateY(0);
        }

        .btn-booking {
            background-color: var(--primary-gold);
            color: #121212;
            box-shadow: 0 4px 15px rgba(197, 168, 128, 0.2);
        }

        .btn-telegram {
            background-color: var(--telegram-color);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.2);
        }

        .btn svg {
            margin-right: 8px;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* Dynamic Room Features Section */
        .features-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
            width: 100%;
            box-sizing: border-box;
        }

        .features-section h3 {
            font-size: 1.2rem;
            color: var(--primary-gold);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 15px;
            min-width: 0; /* Prevents grid items from widening container */
        }

        .feature-item {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            word-break: break-word;
        }

        .feature-item svg {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            color: var(--primary-gold);
            flex-shrink: 0;
        }

        /* Facility Slider Section styling */
        .facility-showcase {
            margin-bottom: 20px;
            overflow: hidden;
            width: 100%;
            box-sizing: border-box;
        }

        .facility-showcase-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary-gold);
            margin-bottom: 6px;
            font-weight: 600;
            text-align: center;
        }

        .facility-website-promo {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .facility-website-promo a {
            color: var(--primary-gold);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dashed var(--primary-gold);
            transition: all 0.3s ease;
