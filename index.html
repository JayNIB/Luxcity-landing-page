<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Luxcity Hotel & Apartment - Room Previews</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #c5a880;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-muted: #cccccc;
            --telegram-color: #0088cc;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        html, body { background-color: var(--dark-bg); color: var(--text-light); margin: 0; padding: 0; width: 100%; overflow-x: hidden; }

        .landing-container { width: 100%; max-width: 100%; background: var(--dark-bg); border-radius: 0; box-shadow: none; border: none; }
        .content-wrapper { width: 100%; max-width: 850px; margin: 0 auto; }
        .hero-banner-container { position: relative; width: 100%; height: 300px; }
        @media (min-width: 768px) { .hero-banner-container { height: 450px; } }
        .hero-banner-image { width: 100%; height: 100%; background: linear-gradient(to top, var(--dark-bg) 0%, rgba(18, 18, 18, 0.4) 40%, rgba(18, 18, 18, 0) 100%), url('luxcityfront.jpg'); background-size: cover; background-position: center center; background-repeat: no-repeat; }
        .brand-header-overlay { position: absolute; bottom: 30px; left: 0; width: 100%; padding: 0 20px; text-align: center; z-index: 2; }
        .brand-logo { max-width: 120px; width: 100%; height: auto; margin: 0 auto 15px auto; display: block; }
        .brand-title-main { font-size: 2.2rem; font-weight: 700; letter-spacing: 0.5px; color: var(--primary-gold); text-shadow: 0 3px 15px rgba(0, 0, 0, 0.9); }
        @media (max-width: 480px) { .brand-title-main { font-size: 1.6rem; } .brand-logo { max-width: 90px; } }
        
        .content-top-block { padding: 20px 20px; width: 100%; }
        .content-bottom-block { padding: 30px 20px 50px 20px; width: 100%; }
        .hotel-info-section { background: var(--card-bg); border-left: 3px solid var(--primary-gold); padding: 20px; border-radius: 4px 8px 8px 4px; margin-bottom: 25px; font-size: 0.95rem; line-height: 1.6; color: var(--text-muted); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .selection-box { margin-bottom: 20px; width: 100%; }
        .selection-box label { display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--primary-gold); margin-bottom: 8px; font-weight: 600; }
        .punchline { font-size: 1.2rem; font-weight: 700; color: #ffffff; margin-bottom: 15px; letter-spacing: 0.5px; line-height: 1.4; }
        .punchline span { color: var(--primary-gold); }
        .room-dropdown { width: 100%; padding: 16px; background-color: var(--card-bg); color: var(--text-light); border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23c5a880' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>"); background-repeat: no-repeat; background-position: right 15px center; background-size: 18px; }
        
        /* Video Player Wrapper Styles */
        .video-fullwidth-wrapper { width: 100vw; position: relative; left: 50%; right: 50%; margin-left: -50vw; margin-right: -50vw; background-color: #000000; cursor: pointer; transition: all 0.3s ease; }
        
        /* Mobile Pop-up Logic */
        .video-fullwidth-wrapper.fullscreen-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            margin: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.95);
        }
        .video-fullwidth-wrapper.fullscreen-mode .video-container { width: 100%; max-width: 95%; }

        .video-container { width: 100%; max-width: 1400px; margin: 0 auto; aspect-ratio: 16 / 9; background-color: #000000; position: relative; }
        .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

        .cta-container { display: flex; flex-direction: column; gap: 16px; margin-bottom: 40px; width: 100%; }
        @media (min-width: 576px) { .cta-container { flex-direction: row; } }
        .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; padding: 18px; font-size: 1rem; font-weight: 700; text-decoration: none; border-radius: 8px; transition: transform 0.4s ease, filter 0.2s ease; text-align: center; white-space: nowrap; }
        .btn-booking { background-color: var(--primary-gold); color: #121212; }
        .btn-telegram { background-color: var(--telegram-color); color: #ffffff; }
        .btn svg { margin-right: 8px; width: 20px; height: 20px; }
        
        .features-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 40px; }
        .feature-item { display: flex; align-items: center; font-size: 0.95rem; margin-bottom: 10px; }
        .feature-item svg { width: 18px; height: 18px; margin-right: 10px; color: var(--primary-gold); }
        
        .facility-showcase { margin-bottom: 30px; overflow: hidden; width: 100%; }
        .facility-showcase-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--primary-gold); margin-bottom: 10px; text-align: center; }
        .facility-website-promo { font-size: 0.95rem; color: var(--text-muted); text-align: center; margin-bottom: 25px; }
        .carousel-viewport { overflow: hidden; width: 100%; border-radius: 16px; padding: 5px 0; }
        .facility-track { display: flex; gap: 16px; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); width: 100%; }
        .facility-card { flex: 0 0 calc(33.333% - 11px); aspect-ratio: 1 / 1; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .facility-icon { width: 32px; height: 32px; stroke: var(--primary-gold); fill: none; margin-bottom: 12px; }
        @media (max-width: 600px) { .facility-card { flex: 0 0 100%; } }
        
        .hotel-footer { border-top: 1px solid var(--border-color); padding-top: 30px; margin-top: 20px; width: 100%; }
        .footer-grid { display: grid; gap: 20px; font-size: 0.95rem; color: var(--text-muted); }
        .social-links { display: flex; gap: 25px; justify-content: center; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="landing-container" id="mainAppCard">
        <div class="hero-banner-container">
            <div class="hero-banner-image"></div>
            <div class="brand-header-overlay">
                <img src="logo-Luxcity-2024.png" alt="Luxcity Logo" class="brand-logo">
                <h1 class="brand-title-main">Luxcity Hotel & Apartment</h1>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="content-top-block">
                <section class="hotel-info-section">
                    <strong>Welcome to Luxcity Hotel & Apartment</strong> – Phnom Penh's premier destination.
                </section>

                <div class="selection-box">
                    <label for="roomSelect">Choose a Room Style</label>
                    <div class="punchline">See it. Love it. <span>Secure it instantly.</span></div>
                    
                    <select id="roomSelect" class="room-dropdown" onchange="updatePageData()">
                        <option value="studio-queen">Studio Queen</option>
                        <option value="studio-twin">Studio Twin</option>
                        <option value="deluxe-classic">Deluxe Classic</option>
                        <option value="deluxe-premium">Deluxe Premium</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="video-fullwidth-wrapper" id="mediaPlayerBlock">
            <div class="video-container">
                <video id="roomVideo" muted loop playsinline poster="thumbnails/deluxe-poster.jpg">
                    <source id="videoSource" src="" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="content-bottom-block">
                <section class="features-section">
                    <h3 id="featureTitle">Studio Queen Features</h3>
                    <div class="features-grid" id="featureGrid"></div>
                </section>
                </div>
        </div>
    </div>

    <script>
        const roomData = { /* ... your data ... */ };
        let playbackTimer; // Timer for the delay

        function updatePageData() {
            const selectedKey = document.getElementById('roomSelect').value;
            const data = roomData[selectedKey];
            if (!data) return;

            const video = document.getElementById('roomVideo');
            const source = document.getElementById('videoSource');
            
            // 1. Reset everything
            clearTimeout(playbackTimer);
            video.pause();
            
            // 2. Load new data
            video.setAttribute('poster', data.thumbnail);
            source.src = data.video;
            video.load();

            // 3. Delay playback by 2 seconds
            playbackTimer = setTimeout(() => {
                video.play().catch(err => console.log("Autoplay paused."));
            }, 2000); 

            // Update UI
            document.getElementById('featureTitle').innerText = data.title;
            const grid = document.getElementById('featureGrid');
            grid.innerHTML = "";
            data.features.forEach(feature => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'feature-item';
                itemDiv.innerHTML = `<span>${feature}</span>`;
                grid.appendChild(itemDiv);
            });
        }

        // Mobile Fullscreen Toggle Logic
        const wrapper = document.getElementById('mediaPlayerBlock');
        wrapper.addEventListener('click', () => {
            wrapper.classList.toggle('fullscreen-mode');
        });

        window.onload = updatePageData;
        
        // ... (your existing carousel and utility scripts) ...
    <script>
        const roomData = {
            "studio-queen": {
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780971958/Luxcity_-_Studio_Queen_p9ja4y.mp4",
                thumbnail: "thumbnails/Studio Queen.jpg",
                title: "Studio Queen Features",
                features: ["32 sqm Living Space", "1 King-Sized Bed", "City View Balcony", "Smart TV & High-Speed Wi-Fi"]
            },
            "studio-twin": {
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780971940/Luxcity_-_Studio_Twin_uq7hgk.mp4",
                thumbnail: "thumbnails/Studio Twin.jpg",
                title: "Studio Twin Features",
                features: ["36 sqm Space", "2 Comfortable Twin Beds", "Modern Ensuite Bathroom", "In-room Safe Box"]
            },
            "deluxe-classic": {
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780973052/Luxcity_-_Deluxe_Classic_tn9isf.mp4",
                thumbnail: "thumbnails/Deluxe Classic.jpg",
                title: "Deluxe Classic Features",
                features: ["55 sqm Premium Layout", "Separate Living & Bedroom", "Fully Equipped Kitchenette", "Washing Machine In-Unit"]
            },
            "deluxe-premium": {
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780971938/Luxcity_-_Deluxe_Premium_mi3bjg.mp4", 
                thumbnail: "thumbnails/Deluxe Premium.jpg",
                title: "Deluxe Premium Features",
                features: ["85 sqm Massive Premium Layout", "1 Master King + 1 Queen Bed", "2 Bathrooms with Bathtub", "Private Washer & Dryer"]
            }
        };

        function updatePageData() {
            const selectedKey = document.getElementById('roomSelect').value;
            const data = roomData[selectedKey];
            if (!data) return;

            const video = document.getElementById('roomVideo');
            const source = document.getElementById('videoSource');
            
            video.pause();
            video.setAttribute('poster', data.thumbnail);
            source.src = data.video;
            video.load();
            video.play().catch(err => console.log("Autoplay handled cleanly."));

            document.getElementById('featureTitle').innerText = data.title;
            const grid = document.getElementById('featureGrid');
            grid.innerHTML = "";
            
            data.features.forEach(feature => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'feature-item';
                itemDiv.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    <span>${feature}</span>
                `;
                grid.appendChild(itemDiv);
            });
        }

        window.onload = function() {
            updatePageData();
            setTimeout(() => {
                document.getElementById('mainAppCard').scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }, 300);
        };

        let currentCarouselIndex = 0;
        const track = document.getElementById('facilityTrack');
        
        function autoSlideFacilities() {
            const cards = document.querySelectorAll('.facility-card');
            if (cards.length === 0) return;
            
            const cardStyle = window.getComputedStyle(cards[0]);
            const cardWidth = cards[0].offsetWidth;
            const gap = parseFloat(cardStyle.marginRight) || 16;
            
            let visibleCards = window.innerWidth <= 600 ? 1 : 3;
            const maxIndex = cards.length - visibleCards;
            
            currentCarouselIndex++;
            if (currentCarouselIndex > maxIndex) {
                currentCarouselIndex = 0;
            }
            
            const moveX = currentCarouselIndex * (cardWidth + gap);
            track.style.transform = `translateX(-${moveX}px)`;
        }
        
        setInterval(autoSlideFacilities, 3500);

        window.addEventListener('resize', () => {
            currentCarouselIndex = 0;
            track.style.transform = 'translateX(0px)';
        });
    </script>
</body>
</html>
