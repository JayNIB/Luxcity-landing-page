<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Luxcity Hotel & Apartment - Room Previews</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #c5a880;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-muted: #cccccc;
            --telegram-color: #0088cc;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        html, body { margin: 0 !important; padding: 0 !important; border: 0 !important; background-color: var(--dark-bg); }

        /* Animation Classes */
        .fade-in-up { opacity: 0; transform: translateY(30px); transition: opacity 1s ease-out, transform 1s ease-out; }
        .fade-in-up.active { opacity: 1; transform: translateY(0); }
        .delay-1 { transition-delay: 0.2s; }
        .delay-2 { transition-delay: 0.4s; }

        .landing-container { width: 100%; max-width: 100%; background: var(--dark-bg); padding-top: 1px; margin-top: -1px; }
        .content-wrapper { width: 100%; max-width: 850px; margin: 0 auto; }

        .hero-banner-container { position: relative; width: 100%; height: 300px; }
        @media (min-width: 768px) { .hero-banner-container { height: 450px; } }

        .hero-banner-image { width: 100%; height: 100%; background: linear-gradient(to top, var(--dark-bg) 0%, rgba(18, 18, 18, 0.4) 40%, rgba(18, 18, 18, 0) 100%), url('luxcityfront.jpg'); background-size: cover; background-position: center center; background-repeat: no-repeat; }

        .brand-header-overlay { position: absolute; bottom: 30px; left: 0; width: 100%; padding: 0 20px; text-align: center; z-index: 2; }
        .brand-logo { max-width: 200px; width: 100%; height: auto; margin: 0 auto 50px auto; display: block; }
        .brand-title-main { font-size: 2.2rem; font-weight: 700; letter-spacing: 0.5px; color: var(--primary-gold); text-shadow: 0 3px 15px rgba(0, 0, 0, 0.9); }
        @media (max-width: 480px) { .brand-title-main { font-size: 1.6rem; } }

        .content-top-block { padding: 20px 20px; width: 100%; }
        .content-bottom-block { padding: 30px 20px 50px 20px; width: 100%; }

        .hotel-info-section { background: var(--card-bg); border-left: 3px solid var(--primary-gold); padding: 20px; border-radius: 0; margin-bottom: 25px; font-size: 0.95rem; line-height: 1.6; color: var(--text-muted); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .hotel-info-section strong { color: var(--text-light); }
        
        .selection-box { margin-bottom: 20px; width: 100%; }
        .selection-box label { display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--primary-gold); margin-bottom: 8px; font-weight: 600; }
        
        .punchline { font-size: 1.2rem; font-weight: 700; color: #ffffff; margin-bottom: 15px; letter-spacing: 0.5px; line-height: 1.4; }
        .punchline span { color: var(--primary-gold); }

        .room-dropdown { width: 100%; padding: 16px; background-color: var(--card-bg); color: var(--text-light); border: 1px solid var(--border-color); border-radius: 0; font-size: 1rem; font-weight: 600; cursor: pointer; outline: none; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23c5a880' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>"); background-repeat: no-repeat; background-position: right 15px center; background-size: 18px; }
        
        .video-fullwidth-wrapper { width: 100vw; position: relative; left: 50%; right: 50%; margin-left: -50vw; margin-right: -50vw; background-color: #000000; }
        .video-container { width: 100%; max-width: 1400px; margin: 0 auto; aspect-ratio: 16 / 9; background-color: #000000; position: relative; }
        .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

        .cta-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 40px; margin-top: -30px; width: 100%; }
        @media (min-width: 576px) { .cta-container { flex-direction: row; } }
        .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; padding: 18px; font-size: 1rem; font-weight: 600; text-decoration: none; border-radius: 0; transition: transform 0.4s ease; text-align: center; }
        .btn-booking { background-color: var(--primary-gold); color: #121212; }
        .btn-telegram { background-color: var(--dark-bg); border: 1px solid var(--primary-gold); color: var(--primary-gold); }

        .features-section { background: var(--card-bg); border: 1px solid var(--border-color); padding: 24px; margin-bottom: 40px; width: 100%; }
        .features-section h3 { font-size: 1.2rem; color: var(--primary-gold); margin-bottom: 15px; }
        .features-wrapper { display: flex; flex-direction: column; gap: 20px; }
        @media (min-width: 768px) { .features-wrapper { flex-direction: row; gap: 40px; } .feature-col { flex: 1; } }
        .feature-item { display: flex; align-items: center; font-size: 0.95rem; color: var(--text-light); margin-bottom: 10px; }
        .feature-item svg { width: 18px; height: 18px; margin-right: 10px; color: var(--primary-gold); flex-shrink: 0; }

        .facility-showcase { margin-bottom: 30px; }
        .facility-track { display: flex; gap: 16px; }
        .facility-card { flex: 0 0 30%; aspect-ratio: 2.35 / 1; background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; text-align: center; }
        @media (max-width: 600px) { .facility-card { flex: 0 0 100%; } }
        .hotel-footer { border-top: 1px solid var(--border-color); padding-top: 30px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="landing-container">
        <div class="hero-banner-container">
            <div class="hero-banner-image"></div>
            <div class="brand-header-overlay fade-in-up">
                <img src="logo-Luxcity-2024.png" alt="Luxcity Logo" class="brand-logo">
                <h1 class="brand-title-main">Luxcity Hotel & Apartment</h1>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="content-top-block">
                <section class="hotel-info-section fade-in-up">
                    <strong>Welcome to Luxcity Hotel & Apartment</strong> – Phnom Penh's premier destination for luxury accommodation.
                </section>

                <div class="selection-box">
                    <label for="roomSelect">Choose a Room Style</label>
                    <div class="punchline">See it. Love it. <span>Secure it instantly.</span></div>
                    <select id="roomSelect" class="room-dropdown" onchange="updatePageData()">
                        <option value="studio-queen">Studio Queen</option>
                        <option value="studio-twin">Studio Twin</option>
                        <option value="deluxe-classic">Deluxe Classic</option>
                        <option value="deluxe-premium">Deluxe Premium</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="video-fullwidth-wrapper">
            <div class="video-container">
                <video id="roomVideo" autoplay muted loop playsinline poster="">
                    <source id="videoSource" src="" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="content-bottom-block">
                <div class="cta-container fade-in-up delay-1">
                    <a href="https://booking.luxcity.com" class="btn btn-booking">Book Instantly Online</a>
                    <a href="https://t.me/luxcityhotelandapartment" class="btn btn-telegram">Chat with Sales</a>
                </div>

                <section class="features-section fade-in-up delay-2">
                    <h3 id="featureTitle">Features</h3>
                    <div class="features-wrapper">
                        <div class="feature-col" id="col1"></div>
                        <div class="feature-col" id="col2"></div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        const roomData = {
            "studio-queen": { 
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780971958/Luxcity_-_Studio_Queen_p9ja4y.mp4", 
                thumbnail: "thumbnails/Studio Queen.jpg", 
                title: "Studio Queen Features", 
                features: ["Expansive Space: 39m²–53m² of room to relax and unwind", "Spa-Inspired: Refresh in your private, separate rain shower", "Resort Perks: Complimentary access to our rooftop pool and fitness center", "Seamless Connection: High-speed Wi-Fi", "Work-Ready: A dedicated, multi-functional workspace"] 
            },
            "studio-twin": { 
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780971940/Luxcity_-_Studio_Twin_uq7hgk.mp4", 
                thumbnail: "thumbnails/Studio Twin.jpg", 
                title: "Studio Twin Features", 
                features: ["Expansive Space: 39m²–53m² layout for maximum comfort", "Flexible Comfort: Twin-bed setup perfect for shared or separate stays", "Relaxation: Private rain shower in the bathroom", "Guest Perks: Free access to our rooftop pool and fitness center", "Connectivity: High-speed Wi-Fi", "Work-Ready: Dedicated, multi-functional desk"] 
            },
            "deluxe-classic": { 
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780973052/Luxcity_-_Deluxe_Classic_tn9isf.mp4", 
                thumbnail: "thumbnails/Deluxe Classic.jpg", 
                title: "Deluxe Classic Features", 
                features: ["Spacious Sanctuary: An expansive 50m²–68m² of refined living space", "King-Sized Luxury: Unwind in ultimate comfort with our premium king bed", "Spa-Inspired: Refresh in your private, separate rain shower", "Guest Perks: Complimentary access to our rooftop pool and fitness center", "Connectivity: High-speed Wi-Fi", "Work-Ready: A dedicated, multi-functional desk for seamless productivity"] 
            },
            "deluxe-premium": { 
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780971938/Luxcity_-_Deluxe_Premium_mi3bjg.mp4", 
                thumbnail: "thumbnails/Deluxe Premium.jpg", 
                title: "Deluxe Premium Features", 
                features: ["Ultimate Space: A sprawling 75m² layout designed for an elevated stay", "King-Sized Luxury: Drift away on our premium king bed", "Spa-Inspired: Unwind in your private, separate rain shower", "Resort Perks: Complimentary access to our rooftop pool and fitness center", "Seamless Connection: High-speed Wi-Fi", "Work-Ready: A dedicated, multi-functional workspace for undisturbed productivity"] 
            }
        };

        let playTimeout; 
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); });
        }, { threshold: 0.1 });

        function updatePageData() {
            const selectedKey = document.getElementById('roomSelect').value;
            const data = roomData[selectedKey];
            const video = document.getElementById('roomVideo');
            
            // Set Thumbnail and Source
            video.poster = data.thumbnail; 
            video.src = data.video;
            video.load();
            video.pause();

            // Auto-play after delay
            if (playTimeout) clearTimeout(playTimeout);
            playTimeout = setTimeout(() => video.play().catch(() => {}), 2000);

            // Render Features
            const col1 = document.getElementById('col1');
            const col2 = document.getElementById('col2');
            document.getElementById('featureTitle').innerText = data.title;
            col1.innerHTML = ''; col2.innerHTML = '';

            const mid = Math.ceil(data.features.length / 2);
            data.features.forEach((feat, index) => {
                const div = document.createElement('div');
                div.className = 'feature-item';
                div.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg> <span>${feat}</span>`;
                index < mid ? col1.appendChild(div) : col2.appendChild(div);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            updatePageData();
            document.querySelectorAll('.fade-in-up').forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
