<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxcity Hotel & Apartment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS RESET FOR FULL WIDTH */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        /* LOGO SECTION */
        .logo-header {
            width: 100%;
            background-color: #121212;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .logo {
            max-width: 180px;
            height: auto;
        }

        /* HERO & LAYOUT */
        .hero-banner {
            width: 100%;
            height: 300px;
            background: linear-gradient(to top, #121212 0%, rgba(18,18,18,0.4) 40%, rgba(18,18,18,0) 100%), url('luxcityfront.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 30px;
        }

        .brand-title { color: #c5a880; font-size: 2rem; }

        .content-wrapper {
            width: 90%;
            max-width: 850px;
            margin: 0 auto;
            padding: 20px 0;
        }

        /* FULL WIDTH VIDEO */
        .video-section {
            width: 100vw;
            background: #000;
            margin: 20px 0;
        }
        .video-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            aspect-ratio: 16/9;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* ROOM CONTROLS */
        .room-dropdown {
            width: 100%;
            padding: 15px;
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            margin-top: 10px;
        }

        /* BUTTONS & FEATURES */
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            text-align: center;
            background: #c5a880;
            color: #121212;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 10px;
        }

        .features-section {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header class="logo-header">
        <img src="logo.png" alt="Luxcity Logo" class="logo">
    </header>

    <div class="hero-banner">
        <h1 class="brand-title">Luxcity Hotel & Apartment</h1>
    </div>

    <div class="content-wrapper">
        <p>Welcome to Luxcity Hotel & Apartment – Phnom Penh's premier destination for luxury accommodation.</p>

        <label for="roomSelect" style="display:block; margin-top:20px;">Choose a Room Style</label>
        <select id="roomSelect" class="room-dropdown" onchange="updatePageData()">
            <option value="studio-queen">Studio Queen</option>
            <option value="studio-twin">Studio Twin</option>
        </select>
    </div>

    <div class="video-section">
        <div class="video-container">
            <video id="roomVideo" autoplay muted loop playsinline controls>
                <source id="videoSource" src="" type="video/mp4">
            </video>
        </div>
    </div>

    <div class="content-wrapper">
        <a href="#" class="btn">Book Instantly Online</a>
        
        <div class="features-section">
            <h3 id="featureTitle">Studio Queen Features</h3>
            <div id="featureGrid"></div>
        </div>
    </div>

    <script>
        const roomData = {
            "studio-queen": {
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780971958/Luxcity_-_Studio_Queen_p9ja4y.mp4",
                features: ["32 sqm Living Space", "1 King-Sized Bed", "City View Balcony"]
            },
            "studio-twin": {
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780971940/Luxcity_-_Studio_Twin_uq7hgk.mp4",
                features: ["36 sqm Space", "2 Twin Beds", "Modern Bathroom"]
            }
        };

        function updatePageData() {
            const selectedKey = document.getElementById('roomSelect').value;
            const data = roomData[selectedKey];
            const video = document.getElementById('roomVideo');
            const source = document.getElementById('videoSource');
            
            source.src = data.video;
            video.load();
            video.play();

            const grid = document.getElementById('featureGrid');
            grid.innerHTML = data.features.map(f => `<p>• ${f}</p>`).join('');
        }

        // Initialize on load
        window.onload = updatePageData;
    </script>
</body>
</html>
