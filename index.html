<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Luxcity Hotel & Apartment - Room Previews</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #c5a880;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-muted: #cccccc;
            --telegram-color: #0088cc;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        html, body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden; 
        }

        .landing-container { width: 100%; max-width: 100%; background: var(--dark-bg); }
        .content-wrapper { width: 100%; max-width: 850px; margin: 0 auto; }

        .hero-banner-container { position: relative; width: 100%; height: 300px; }
        @media (min-width: 768px) { .hero-banner-container { height: 450px; } }
        .hero-banner-image { width: 100%; height: 100%; background: linear-gradient(to top, var(--dark-bg) 0%, rgba(18, 18, 18, 0.4) 40%, rgba(18, 18, 18, 0) 100%), url('luxcityfront.jpg'); background-size: cover; background-position: center center; }

        .brand-header-overlay { position: absolute; bottom: 30px; left: 0; width: 100%; padding: 0 20px; text-align: center; z-index: 2; }
        .brand-logo { max-width: 120px; width: 100%; height: auto; margin: 0 auto 15px auto; display: block; }
        .brand-title-main { font-size: 2.2rem; font-weight: 700; color: var(--primary-gold); text-shadow: 0 3px 15px rgba(0, 0, 0, 0.9); }
        @media (max-width: 480px) { .brand-title-main { font-size: 1.6rem; } .brand-logo { max-width: 90px; } }

        /* Fullscreen Modal Styles */
        .video-fullwidth-wrapper { width: 100vw; position: relative; left: 50%; right: 50%; margin-left: -50vw; margin-right: -50vw; background-color: #000000; z-index: 10; transition: all 0.3s ease; }
        
        .video-fullwidth-wrapper.fullscreen-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            margin: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.95);
        }

        .video-container { width: 100%; max-width: 1400px; margin: 0 auto; aspect-ratio: 16 / 9; background-color: #000000; position: relative; }
        .video-fullwidth-wrapper.fullscreen-mode .video-container { max-width: 90%; aspect-ratio: 16/9; }
        .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }

        .content-top-block { padding: 20px 20px; width: 100%; }
        .content-bottom-block { padding: 30px 20px 50px 20px; width: 100%; }
        .hotel-info-section { background: var(--card-bg); border-left: 3px solid var(--primary-gold); padding: 20px; border-radius: 4px 8px 8px 4px; margin-bottom: 25px; font-size: 0.95rem; line-height: 1.6; color: var(--text-muted); }
        .room-dropdown { width: 100%; padding: 16px; background-color: var(--card-bg); color: var(--text-light); border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .features-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 40px; }
        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .feature-item { display: flex; align-items: center; font-size: 0.95rem; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="landing-container" id="mainAppCard">
        <div class="hero-banner-container">
            <div class="hero-banner-image"></div>
            <div class="brand-header-overlay">
                <img src="logo.png" alt="Luxcity Logo" class="brand-logo">
                <h1 class="brand-title-main">Luxcity Hotel & Apartment</h1>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="content-top-block">
                <section class="hotel-info-section">
                    <strong>Welcome to Luxcity Hotel & Apartment</strong> – Phnom Penh's premier destination for luxury accommodation and extended stays.
                </section>
                <div class="selection-box">
                    <select id="roomSelect" class="room-dropdown" onchange="updatePageData()">
                        <option value="studio-queen">Studio Queen</option>
                        <option value="studio-twin">Studio Twin</option>
                        <option value="deluxe-classic">Deluxe Classic</option>
                        <option value="deluxe-premium">Deluxe Premium</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="video-fullwidth-wrapper" id="mediaPlayerBlock">
            <div class="video-container">
                <video id="roomVideo" muted loop playsinline poster="thumbnails/deluxe-poster.jpg">
                    <source id="videoSource" src="" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="content-bottom-block">
                <section class="features-section">
                    <h3 id="featureTitle">Features</h3>
                    <div class="features-grid" id="featureGrid"></div>
                </section>
            </div>
        </div>
    </div>

    <script>
        const roomData = {
            "studio-queen": {
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780971958/Luxcity_-_Studio_Queen_p9ja4y.mp4",
                thumbnail: "thumbnails/Studio Queen.jpg",
                title: "Studio Queen Features",
                features: ["32 sqm Living Space", "1 King-Sized Bed", "City View Balcony", "Smart TV & High-Speed Wi-Fi"]
            },
            "studio-twin": {
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780971940/Luxcity_-_Studio_Twin_uq7hgk.mp4",
                thumbnail: "thumbnails/Studio Twin.jpg",
                title: "Studio Twin Features",
                features: ["36 sqm Space", "2 Comfortable Twin Beds", "Modern Ensuite Bathroom", "In-room Safe Box"]
            },
            "deluxe-classic": {
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780973052/Luxcity_-_Deluxe_Classic_tn9isf.mp4",
                thumbnail: "thumbnails/Deluxe Classic.jpg",
                title: "Deluxe Classic Features",
                features: ["55 sqm Premium Layout", "Separate Living & Bedroom", "Fully Equipped Kitchenette", "Washing Machine In-Unit"]
            },
            "deluxe-premium": {
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780971938/Luxcity_-_Deluxe_Premium_mi3bjg.mp4", 
                thumbnail: "thumbnails/Deluxe Premium.jpg",
                title: "Deluxe Premium Features",
                features: ["85 sqm Massive Premium Layout", "1 Master King + 1 Queen Bed", "2 Bathrooms with Bathtub", "Private Washer & Dryer"]
            }
        };

        let playTimeout;

        function updatePageData() {
            const selectedKey = document.getElementById('roomSelect').value;
            const data = roomData[selectedKey];
            if (!data) return;

            const video = document.getElementById('roomVideo');
            const source = document.getElementById('videoSource');
            
            // Clear existing playback delay
            clearTimeout(playTimeout);
            
            video.pause();
            video.setAttribute('poster', data.thumbnail);
            source.src = data.video;
            video.load();

            // Set 2-second delay
            playTimeout = setTimeout(() => {
                video.play().catch(err => console.log("Autoplay blocked."));
            }, 2000); 
            
            // Update UI
            document.getElementById('featureTitle').innerText = data.title;
            const grid = document.getElementById('featureGrid');
            grid.innerHTML = "";
            
            data.features.forEach(feature => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'feature-item';
                itemDiv.innerHTML = `<span>${feature}</span>`;
                grid.appendChild(itemDiv);
            });
        }

        // Mobile Fullscreen Toggle
        const wrapper = document.getElementById('mediaPlayerBlock');
        wrapper.addEventListener('click', () => {
            wrapper.classList.toggle('fullscreen-mode');
        });

        window.onload = updatePageData;
    </script>
</body>
</html>
