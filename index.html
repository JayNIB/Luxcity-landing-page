<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Luxcity Hotel & Apartment - Room Previews</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #c5a880;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-muted: #cccccc;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        /* --- ANIMATION CLASSES --- */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        .fade-in-up.active {
            opacity: 1;
            transform: translateY(0);
        }
        .delay-1 { transition-delay: 0.2s; }
        .delay-2 { transition-delay: 0.4s; }
        .delay-3 { transition-delay: 0.6s; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        html, body { margin: 0 !important; padding: 0 !important; background-color: var(--dark-bg); color: var(--text-light); }

        .landing-container { width: 100%; max-width: 100%; background: var(--dark-bg); }
        .content-wrapper { width: 100%; max-width: 850px; margin: 0 auto; padding: 0 20px; }

        /* Cinematic Hero */
        .hero-banner-container { position: relative; width: 100%; height: 300px; }
        @media (min-width: 768px) { .hero-banner-container { height: 450px; } }
        .hero-banner-image { width: 100%; height: 100%; background: linear-gradient(to top, var(--dark-bg) 0%, rgba(18, 18, 18, 0.4) 40%, rgba(18, 18, 18, 0) 100%), url('luxcityfront.jpg'); background-size: cover; background-position: center center; }

        .brand-header-overlay { position: absolute; bottom: 30px; left: 0; width: 100%; text-align: center; z-index: 2; }
        .brand-logo { max-width: 200px; width: 100%; margin: 0 auto 20px auto; display: block; }
        .brand-title-main { font-size: 2.2rem; font-weight: 700; color: var(--primary-gold); }

        .hotel-info-section { padding: 30px 0; font-size: 1.1rem; line-height: 1.7; color: var(--text-muted); border-bottom: 1px solid rgba(197, 168, 128, 0.2); margin-bottom: 30px; }
        
        .room-dropdown { width: 100%; padding: 16px; background-color: var(--card-bg); color: var(--text-light); border: 1px solid var(--border-color); font-size: 1rem; cursor: pointer; }

        /* Video Section */
        .video-fullwidth-wrapper { width: 100%; background-color: #000; margin-bottom: 20px; }
        .video-container { width: 100%; aspect-ratio: 16 / 9; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* CTA & Features */
        .cta-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 40px; }
        @media (min-width: 576px) { .cta-container { flex-direction: row; } }
        .btn { flex: 1; padding: 18px; text-align: center; text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: center; }
        .btn-booking { background-color: var(--primary-gold); color: #121212; }
        .btn-telegram { border: 1px solid var(--primary-gold); color: var(--primary-gold); }

        .features-section { background: var(--card-bg); padding: 24px; margin-bottom: 40px; }
        .features-wrapper { display: flex; flex-wrap: wrap; gap: 20px; }
        .feature-col { flex: 1; min-width: 280px; }
        .feature-item { display: flex; align-items: center; margin-bottom: 15px; }
        .feature-item svg { width: 20px; height: 20px; margin-right: 10px; color: var(--primary-gold); flex-shrink: 0; }

        /* Footer */
        .hotel-footer { border-top: 1px solid var(--border-color); padding: 40px 0; text-align: center; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="landing-container">
        <div class="hero-banner-container">
            <div class="hero-banner-image"></div>
            <div class="brand-header-overlay fade-in-up">
                <img src="logo-Luxcity-2024.png" alt="Luxcity Logo" class="brand-logo">
                <h1 class="brand-title-main">Luxcity Hotel & Apartment</h1>
            </div>
        </div>

        <div class="content-wrapper">
            <section class="hotel-info-section fade-in-up delay-1">
                <strong>Welcome to Luxcity</strong> – Experience a seamless blend of modern hotel convenience and full-service apartment comfort in the heart of Phnom Penh.
            </section>

            <div class="selection-box fade-in-up delay-1">
                <select id="roomSelect" class="room-dropdown" onchange="updatePageData()">
                    <option value="studio-queen">Studio Queen</option>
                    <option value="studio-twin">Studio Twin</option>
                    <option value="deluxe-classic">Deluxe Classic</option>
                    <option value="deluxe-premium">Deluxe Premium</option>
                </select>
            </div>
        </div>

        <div class="video-fullwidth-wrapper fade-in-up delay-2">
            <div class="video-container">
                <video id="roomVideo" autoplay muted loop playsinline poster="">
                    <source id="videoSource" src="" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="cta-container fade-in-up delay-2">
                <a href="https://booking.luxcity.com" class="btn btn-booking">Book Instantly</a>
                <a href="https://t.me/luxcityhotelandapartment" class="btn btn-telegram">Chat (Telegram)</a>
            </div>

            <section class="features-section fade-in-up delay-3">
                <h3 id="featureTitle" style="color:var(--primary-gold); margin-bottom: 20px;">Features</h3>
                <div class="features-wrapper">
                    <div class="feature-col" id="col1"></div>
                    <div class="feature-col" id="col2"></div>
                </div>
            </section>
        </div>
    </div>

    <script>
        // --- DATA ---
        const roomData = {
            "studio-queen": {
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780971958/Luxcity_-_Studio_Queen_p9ja4y.mp4",
                thumbnail: "thumbnails/Studio-Queen.jpg",
                title: "Studio Queen Features",
                features: ["39m²–53m² Spacious layout", "Private rain shower", "Rooftop pool & fitness access", "High-speed Wi-Fi", "Multi-functional workspace"]
            },
            "studio-twin": {
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780971940/Luxcity_-_Studio_Twin_uq7hgk.mp4",
                thumbnail: "thumbnails/Studio-Twin.jpg",
                title: "Studio Twin Features",
                features: ["39m²–53m² Spacious layout", "Twin-bed setup", "Private rain shower", "Rooftop pool access", "High-speed Wi-Fi"]
            },
            "deluxe-classic": {
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780973052/Luxcity_-_Deluxe_Classic_tn9isf.mp4",
                thumbnail: "thumbnails/Deluxe-Classic.jpg",
                title: "Deluxe Classic Features",
                features: ["50m²–68m² Refined living", "Premium King Bed", "Private rain shower", "Rooftop pool access", "Work-ready desk"]
            },
            "deluxe-premium": {
                video: "https://res.cloudinary.com/dboyyhzr2/video/upload/v1780971938/Luxcity_-_Deluxe_Premium_mi3bjg.mp4",
                thumbnail: "thumbnails/Deluxe-Premium.jpg",
                title: "Deluxe Premium Features",
                features: ["75m² Sprawling layout", "Premium King Bed", "Private rain shower", "Rooftop pool access", "High-speed Wi-Fi"]
            }
        };

        // --- ANIMATION OBSERVER ---
        const observer = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    obs.unobserve(entry.target); // Runs only once
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in-up').forEach(el => observer.observe(el));

        // --- VIDEO & DATA LOGIC ---
        let playTimeout; 

        function updatePageData() {
            const selectedKey = document.getElementById('roomSelect').value;
            const data = roomData[selectedKey];
            if (!data) return;

            if (playTimeout) clearTimeout(playTimeout);

            const video = document.getElementById('roomVideo');
            const source = document.getElementById('videoSource');
            
            video.poster = data.thumbnail; 
            source.src = data.video;
            video.load(); 
            video.pause();

            playTimeout = setTimeout(() => {
                video.muted = true; 
                video.play().catch(err => console.log("Autoplay blocked"));
            }, 2000);

            // Render Features
            const col1 = document.getElementById('col1');
            const col2 = document.getElementById('col2');
            col1.innerHTML = ''; col2.innerHTML = '';
            document.getElementById('featureTitle').innerText = data.title;

            const mid = Math.ceil(data.features.length / 2);
            data.features.forEach((feat, index) => {
                const div = document.createElement('div');
                div.className = 'feature-item';
                div.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg> <span>${feat}</span>`;
                index < mid ? col1.appendChild(div) : col2.appendChild(div);
            });
        }

        window.addEventListener('DOMContentLoaded', updatePageData);
    </script>
</body>
</html>
